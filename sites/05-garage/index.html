<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="kit.js"></script>
<style>
:root{--fond:#111214;--encre:#f4f4f0;--accent:#ffcc00;--acier:#1d1f23}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Barlow,system-ui,sans-serif;background:var(--fond);color:var(--encre);line-height:1.55;overflow-x:hidden}
a{color:inherit}
h1,h2,h3,.c{font-family:"Barlow Condensed",Impact,sans-serif;text-transform:uppercase;font-weight:800;line-height:.92}
.rayures{height:16px;background:repeating-linear-gradient(-45deg,var(--accent) 0 22px,#000 22px 44px)}
.top{display:flex;align-items:center;gap:18px;padding:16px clamp(16px,5vw,60px);flex-wrap:wrap}
.logo{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-style:italic;font-size:1.7rem;text-transform:uppercase;margin-right:auto}
.logo::before{content:"";display:inline-block;width:14px;height:14px;background:var(--accent);margin-right:10px;transform:skewX(-14deg)}
.etat{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:6px 12px;background:var(--acier);border-left:4px solid #e5533c}
.etat.ouvert{border-color:#58d07a}
.hero{padding:clamp(30px,6vw,90px) clamp(16px,5vw,60px)}
.sur{color:var(--accent);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem}
h1{font-size:clamp(3rem,10.5vw,9.5rem);font-style:italic;margin:14px 0 22px;max-width:13ch}
h1 mark{background:var(--accent);color:#000;padding:0 .12em;display:inline-block;transform:skewX(-6deg)}
.hero p.i{max-width:52ch;font-size:1.12rem;opacity:.85}
.btn{display:inline-block;font:700 1.15rem "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:26px 12px 0 0;padding:14px 26px;background:var(--accent);color:#000;text-decoration:none;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:.2s}
.btn:hover{filter:brightness(1.12);transform:translateX(4px)}
.btn.alt{background:var(--encre)}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-block:1px solid #fff2}
.chiffres div{padding:26px clamp(16px,3vw,34px);border-right:1px solid #fff2}
.chiffres b{font:800 clamp(2.4rem,5vw,3.8rem)/1 "Barlow Condensed",sans-serif;color:var(--accent);display:block}
.chiffres span{font-size:.85rem;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.devis{display:grid;grid-template-columns:1.3fr .9fr;gap:clamp(20px,4vw,56px);padding:clamp(44px,7vw,100px) clamp(16px,5vw,60px);align-items:start}
h2{font-size:clamp(2.4rem,6vw,4.6rem);margin-bottom:22px}
h2 span{color:var(--accent)}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.16em;opacity:.6;margin:22px 0 10px;display:block}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix button{font:700 1.15rem "Barlow Condensed",sans-serif;text-transform:uppercase;background:var(--acier);color:inherit;border:2px solid transparent;padding:10px 20px;cursor:pointer;transition:.15s}
.choix button.on{background:var(--accent);color:#000}
.prestas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.prestas label{display:flex;gap:12px;align-items:center;background:var(--acier);padding:13px 14px;cursor:pointer;border-left:4px solid transparent;transition:.15s;user-select:none}
.prestas label:hover{border-color:#fff5}
.prestas input{appearance:none;width:20px;height:20px;border:2px solid #fff6;flex:none;display:grid;place-items:center;margin:0}
.prestas input:checked{background:var(--accent);border-color:var(--accent)}
.prestas input:checked::after{content:"✓";color:#000;font-weight:800;font-size:.85rem}
.prestas label:has(input:checked){border-color:var(--accent)}
.prestas span{flex:1;font-weight:500}.prestas small{opacity:.55;display:block;font-weight:400}
.compteur{position:sticky;top:20px;background:var(--acier);padding:26px;text-align:center;border-top:6px solid var(--accent)}
.compteur svg{width:100%;max-width:300px}
#aiguille{transform-origin:150px 150px;transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.compteur .prix{font:800 clamp(2.4rem,5vw,3.4rem)/1 "Barlow Condensed",sans-serif;color:var(--accent);margin-top:6px}
.compteur p{font-size:.85rem;opacity:.7;margin:8px 0 4px}
@media(max-width:860px){.devis{grid-template-columns:1fr}.compteur{position:static}}
.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;padding:clamp(40px,6vw,80px) clamp(16px,5vw,60px);background:var(--acier)}
.hor{list-style:none;padding:0}
.hor li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #fff2}
.hor .auj{color:var(--accent);font-weight:600}
footer{padding:22px;text-align:center;font-size:.8rem;opacity:.6}
</style>
</head>
<body>
<div class="rayures"></div>
<header class="top"><span class="logo" data-t="nom"></span><span class="etat" data-etat></span></header>

<section class="hero">
  <p class="sur" data-t="metier"></p>
  <h1 id="h1"></h1>
  <p class="i" data-t="intro"></p>
  <a class="btn" href="#devis">Estimer ma facture</a><a class="btn alt" data-href="tel" data-t="telephone"></a>
</section>

<div class="chiffres" id="chiffres"></div>

<section class="devis" id="devis">
  <div>
    <h2>Votre devis <span>en direct</span></h2>
    <span class="label">1 · Votre véhicule</span>
    <div class="choix" id="vehicules"></div>
    <span class="label">2 · Ce qu'il faut faire</span>
    <div class="prestas" id="prestas"></div>
  </div>
  <aside class="compteur">
    <svg viewBox="0 0 300 175" aria-hidden="true">
      <path d="M30 150 A120 120 0 0 1 270 150" fill="none" stroke="#fff2" stroke-width="16"/>
      <path id="arc" d="M30 150 A120 120 0 0 1 270 150" fill="none" stroke="var(--accent)" stroke-width="16" stroke-dasharray="377" stroke-dashoffset="377" style="transition:stroke-dashoffset .9s"/>
      <g id="aiguille" style="transform:rotate(-90deg)"><path d="M146 150 L150 44 L154 150 Z" fill="var(--encre)"/></g>
      <circle cx="150" cy="150" r="12" fill="var(--accent)"/>
    </svg>
    <div class="prix" id="prix">— €</div>
    <p id="detail">Cochez une prestation</p>
    <a class="btn" id="envoyer" target="_blank" rel="noopener">Réserver ce devis</a>
  </aside>
</section>

<section class="infos">
  <div class="rv"><h2>Horaires</h2><ul class="hor" data-horaires></ul></div>
  <div class="rv"><h2>L'atelier</h2><p data-t="adresse"></p><a class="btn" data-href="maps" target="_blank" rel="noopener">Itinéraire</a></div>
</section>
<footer data-copy></footer>
<div class="rayures"></div>

<script>
const { $, $$, esc, euro, wa } = K, C = CONFIG;
const mots = C.accroche.split(" ");
$("#h1").innerHTML = `${esc(mots[0])} <mark>${esc(mots[1] || "")}</mark> ${esc(mots.slice(2).join(" "))}`;
$("#chiffres").innerHTML = C.chiffres.map((c) => `<div class="rv"><b>${esc(c.n)}</b><span>${esc(c.t)}</span></div>`).join("");

let veh = 0;
$("#prestas").innerHTML = C.prestations.map((p, i) => `<label><input type="checkbox" value="${i}"><span>${esc(p.nom)}<small>${esc(p.duree)}</small></span><b>${euro(p.prix)}</b></label>`).join("");
const max = C.prestations.reduce((s, p) => s + p.prix, 0) * 0.6;

function calcule() {
  $("#vehicules").innerHTML = C.vehicules.map((v, i) => `<button class="${i === veh ? "on" : ""}" data-i="${i}">${esc(v.nom)}</button>`).join("");
  $$("#vehicules button").forEach((b) => (b.onclick = () => { veh = +b.dataset.i; calcule(); }));
  const choisies = $$("#prestas input:checked").map((i) => C.prestations[i.value]);
  const total = choisies.reduce((s, p) => s + p.prix, 0) * C.vehicules[veh].coef;
  const r = (n) => Math.round(n / 5) * 5, bas = r(total * (1 - C.marge)), haut = r(total * (1 + C.marge));
  const part = Math.min(total / max, 1);
  $("#aiguille").style.transform = `rotate(${-90 + part * 180}deg)`;
  $("#arc").style.strokeDashoffset = 377 * (1 - part);
  $("#prix").textContent = total ? `${bas} – ${euro(haut)}` : "— €";
  $("#detail").textContent = total ? `${choisies.length} prestation${choisies.length > 1 ? "s" : ""} · ${C.vehicules[veh].nom} · TTC, pièces et main-d'œuvre` : "Cochez une prestation";
  $("#envoyer").href = wa(`Bonjour ${C.nom}, je souhaite un rendez-vous pour ma ${C.vehicules[veh].nom.toLowerCase()} : ${choisies.map((p) => p.nom).join(", ") || "à définir"}. Estimation du site : ${bas} – ${haut} €.`);
}
$("#prestas").onchange = calcule;
calcule();
</script>
</body>
</html>

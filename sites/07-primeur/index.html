<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="kit.js"></script>
<style>
:root{--fond:#f2f5e6;--encre:#1d3a24;--accent:#e8492b;--doux:#dbe7c3;--soleil:#f6c445}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--fond);color:var(--encre);line-height:1.5;overflow-x:hidden}
a{color:inherit}
h1,h2,h3{font-weight:800;line-height:.95;letter-spacing:-.03em}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px clamp(16px,5vw,56px)}
.logo{font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:10px}
.logo::before{content:"";width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg)}
.etat{font-weight:600;font-size:.82rem;padding:7px 14px;border-radius:99px;border:2px solid var(--encre)}
.etat.ouvert{background:var(--encre);color:var(--fond)}
.hero{padding:clamp(20px,5vw,60px) clamp(16px,5vw,56px) 0}
h1{font-size:clamp(2.8rem,9vw,8rem);max-width:14ch}
h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:1.2rem;max-width:44ch;margin-top:22px}
.saison{display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,5vw,70px);align-items:center;padding:clamp(40px,6vw,80px) clamp(16px,5vw,56px)}
/* la roue des 12 mois */
.roue{--t:min(84vw,430px);width:var(--t);height:var(--t);border-radius:50%;background:var(--doux);position:relative;flex:none;margin:auto}
.roue::before{content:"";position:absolute;inset:19%;border-radius:50%;background:var(--fond)}
.roue button{position:absolute;left:50%;top:50%;width:13%;height:13%;margin:-6.5%;border-radius:50%;border:0;font-family:inherit;font-weight:600;font-size:clamp(.65rem,1.6vw,.85rem);text-transform:uppercase;background:none;color:var(--encre);cursor:pointer;transition:background .25s,color .25s,scale .25s;transform:rotate(calc(var(--i)*30deg)) translateY(calc(var(--t)*-.405)) rotate(calc(var(--i)*-30deg))}
.roue button:hover{background:var(--soleil)}
.roue button.on{background:var(--accent);color:#fff;scale:1.25}
.roue button.auj::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px dashed var(--encre);animation:tourne 12s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.centre{position:absolute;inset:19%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.centre b{font-size:clamp(1.8rem,5.4vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.centre span{font-size:.9rem;opacity:.7;margin-top:6px}
.etal h2{font-size:clamp(1.8rem,4vw,3rem);margin-bottom:22px}
.etal h2 em{font-style:normal;color:var(--accent)}
.puces{display:flex;flex-wrap:wrap;gap:10px}
.puces span{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:99px;padding:8px 16px 8px 8px;font-weight:600;animation:pousse .45s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 2px 0 var(--doux)}
.puces i{font-style:normal;font-size:1.5rem;width:38px;height:38px;border-radius:50%;background:var(--doux);display:grid;place-items:center}
@keyframes pousse{from{opacity:0;transform:scale(.4) translateY(20px)}}
@media(max-width:860px){.saison{grid-template-columns:1fr}}
.paniers{background:var(--encre);color:var(--fond);padding:clamp(44px,7vw,90px) clamp(16px,5vw,56px);border-radius:40px 40px 0 0}
.paniers h2{font-size:clamp(2.2rem,6vw,4.6rem);margin-bottom:30px}
.paniers h2 em{font-style:normal;color:var(--soleil)}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.grille article{background:var(--fond);color:var(--encre);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:10px;transition:transform .3s}
.grille article:hover{transform:translateY(-8px) rotate(-1deg)}
.grille h3{font-size:1.8rem}
.grille b{font-size:2.6rem;font-weight:800;color:var(--accent);letter-spacing:-.03em}
.grille p{flex:1}
.btn{display:inline-block;padding:13px 22px;border-radius:99px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none;text-align:center;transition:.2s}
.btn:hover{background:var(--encre)}
.grille .btn:hover{background:var(--encre)}
.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;padding:clamp(44px,7vw,90px) clamp(16px,5vw,56px)}
.infos h2{font-size:2.4rem;margin-bottom:16px}
.hor{list-style:none;padding:0}
.hor li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:2px solid var(--doux)}
.hor .auj{color:var(--accent);font-weight:800}
footer{padding:26px;text-align:center;font-size:.82rem;opacity:.65}
</style>
</head>
<body>
<header class="top"><span class="logo" data-t="nom"></span><span class="etat" data-etat></span></header>

<section class="hero">
  <h1 id="h1"></h1>
  <p data-t="intro"></p>
</section>

<section class="saison">
  <div class="roue" id="roue"><div class="centre"><b id="moisNom"></b><span id="moisNb"></span></div></div>
  <div class="etal"><h2>Sur l'étal <em id="moisTitre"></em></h2><div class="puces" id="puces"></div></div>
</section>

<section class="paniers">
  <h2 class="rv">Les paniers <em>de la semaine</em></h2>
  <div class="grille" id="paniers"></div>
</section>

<section class="infos">
  <div class="rv"><h2>Horaires</h2><ul class="hor" data-horaires></ul></div>
  <div class="rv"><h2>L'épicerie</h2><p data-t="adresse" style="margin-bottom:18px"></p>
    <a class="btn" data-href="tel" data-t="telephone"></a> <a class="btn" data-href="maps" target="_blank" rel="noopener">Itinéraire</a></div>
</section>
<footer data-copy></footer>

<script>
const { $, $$, esc, euro, wa } = K, C = CONFIG;
const MOIS = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
const virg = C.accroche.split(", ");
$("#h1").innerHTML = `<em>${esc(virg[0])}</em>` + (virg[1] ? ", " + esc(virg[1]) : "");

const auj = new Date().getMonth();
$("#roue").insertAdjacentHTML("beforeend", MOIS.map((m, i) => `<button style="--i:${i}" data-m="${i}" class="${i === auj ? "auj" : ""}" aria-label="${m}">${m.slice(0, 3)}</button>`).join(""));
function mois(i) {
  const liste = C.produits.filter((p) => p.mois.includes(i + 1));
  $$("#roue button").forEach((b) => b.classList.toggle("on", +b.dataset.m === i));
  $("#moisNom").textContent = MOIS[i];
  $("#moisNb").textContent = liste.length + " produits de saison";
  $("#moisTitre").textContent = (i === auj ? "en ce moment" : "en " + MOIS[i].toLowerCase());
  $("#puces").innerHTML = liste.map((p, n) => `<span style="animation-delay:${n * 35}ms"><i>${esc(p.emoji)}</i>${esc(p.nom)}</span>`).join("");
}
$$("#roue button").forEach((b) => (b.onclick = () => mois(+b.dataset.m)));
mois(auj);

$("#paniers").innerHTML = C.paniers.map((p) => `<article class="rv"><h3>${esc(p.nom)}</h3><b>${euro(p.prix)}</b><p>${esc(p.desc)}</p><a class="btn" target="_blank" rel="noopener" href="${wa(`Bonjour, je voudrais réserver le panier « ${p.nom} » (${p.prix} €).`)}">Réserver</a></article>`).join("");
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a0f4a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Roue des cadeaux</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="kit.js"></script>
<style>
:root{--fond:#2a0f4a;--encre:#fff7e8;--accent:#ffcf33;--rose:#ff4f8b;--ext:#150626}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Outfit,system-ui,sans-serif;background:var(--ext);color:var(--encre);display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{width:100%;max-width:430px;height:100dvh;background:radial-gradient(circle at 50% 38%,#4a1c80,var(--fond) 70%);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){.app{height:min(880px,94dvh);border-radius:46px;box-shadow:0 0 0 11px #0a0314,0 40px 90px -20px #000}}
header{padding:30px 22px 0;text-align:center}
header small{font-size:.76rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Lilita One",sans-serif;font-weight:400;font-size:2.2rem;line-height:1}
header p{opacity:.75;font-size:.9rem;margin-top:6px}
.scroll{flex:1;overflow-y:auto;padding:14px 22px 26px;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;gap:18px}
.scene{position:relative;width:min(100%,330px);aspect-ratio:1;flex:none}
.scene::before{content:"";position:absolute;inset:-3%;border-radius:50%;background:repeating-conic-gradient(var(--accent) 0 6deg,#b8860b 6deg 12deg);box-shadow:0 20px 50px #0008,inset 0 0 0 3px #0003}
#roue{position:absolute;inset:2%;width:96%;height:96%;border-radius:50%;transition:transform 5s cubic-bezier(.12,.7,.08,1)}
#roue text{font-family:"Lilita One",sans-serif;font-size:10.5px;fill:#1b0a33}
.fleche{position:absolute;left:50%;top:-6%;width:34px;height:44px;margin-left:-17px;z-index:3;background:var(--encre);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 4px 4px #0006)}
.moyeu{position:absolute;inset:39%;border-radius:50%;background:var(--encre);color:var(--fond);font-family:"Lilita One",sans-serif;font-size:1.05rem;z-index:2;box-shadow:0 6px 0 #c9bfa8,0 12px 20px #0006;transition:transform .1s,box-shadow .1s}
.moyeu:active{transform:translateY(4px);box-shadow:0 2px 0 #c9bfa8}
.moyeu:disabled{opacity:.6;cursor:not-allowed}
.gros{width:100%;padding:18px;border-radius:20px;background:var(--accent);color:#2a0f4a;font-family:"Lilita One",sans-serif;font-size:1.25rem;box-shadow:0 6px 0 #b8860b;transition:.1s}
.gros:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
.gros:disabled{filter:grayscale(.8);opacity:.6;cursor:not-allowed}
.mes{width:100%}
.mes h2{font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
.lot{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#ffffff14;border:1.5px dashed #fff5;border-radius:16px;padding:12px 14px;margin-bottom:8px}
.lot b{display:block}.lot small{opacity:.7}
.lot code{font:800 .95rem Outfit,sans-serif;background:var(--accent);color:#2a0f4a;padding:6px 10px;border-radius:9px;white-space:nowrap}
.voile{position:absolute;inset:0;background:#000b;opacity:0;pointer-events:none;transition:.3s;z-index:5}
.gain{position:absolute;left:22px;right:22px;top:50%;z-index:6;background:var(--encre);color:#2a0f4a;border-radius:30px;padding:30px 22px;text-align:center;transform:translateY(-50%) scale(.5);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.2,1.5,.4,1)}
.ouvert .voile{opacity:1;pointer-events:auto}.ouvert .gain{transform:translateY(-50%);opacity:1;pointer-events:auto}
.gain .e{font-size:3.6rem;line-height:1}
.gain h3{font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.8rem;line-height:1.1;margin:8px 0}
.gain code{display:inline-block;font:800 1.5rem Outfit,sans-serif;letter-spacing:.08em;border:2.5px dashed var(--rose);color:var(--rose);border-radius:14px;padding:10px 18px;margin:12px 0 8px}
.gain p{opacity:.7;font-size:.9rem}
.gain button{margin-top:16px;width:100%;padding:15px;border-radius:16px;background:#2a0f4a;color:#fff;font-weight:800}
.confetti{position:absolute;top:-14px;width:9px;height:14px;z-index:9;animation:tombe linear forwards;pointer-events:none}
@keyframes tombe{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header><small data-t="metier"></small><h1 data-t="nom"></h1><p data-t="accroche"></p></header>
  <div class="scroll">
    <div class="scene"><div class="fleche"></div><svg id="roue" viewBox="-100 -100 200 200"></svg><button class="moyeu" id="moyeu">GO</button></div>
    <button class="gros" id="lancer"></button>
    <div class="mes"><h2>Mes lots à utiliser</h2><div id="lots"></div></div>
  </div>
  <div class="voile" id="voile"></div>
  <div class="gain" id="gain"></div>
</div>

<script>
const { $, esc, store } = K, C = CONFIG, L = C.lots, part = 360 / L.length;
const pt = (a, r) => [r * Math.sin((a * Math.PI) / 180), -r * Math.cos((a * Math.PI) / 180)].map((n) => n.toFixed(2)).join(" ");
// Dessin de la roue : chaque part part du haut et tourne dans le sens des aiguilles d'une montre
$("#roue").innerHTML = L.map((l, i) => {
  const a0 = i * part, a1 = a0 + part, mid = a0 + part / 2;
  return `<path d="M0 0 L${pt(a0, 100)} A100 100 0 0 1 ${pt(a1, 100)} Z" fill="${esc(l.couleur)}" stroke="#2a0f4a" stroke-width="1.2"/>
    <text transform="rotate(${mid - 90})" x="92" text-anchor="end" dominant-baseline="central">${esc(l.court)}</text>`;
}).join("");

let lots = store.get("lots", []).filter((l) => l.fin >= Date.now()), rot = 0, enCours = false;
const aujourdhui = new Date().toDateString();
const dejaJoue = () => !C.demo && store.get("dernierTour", "") === aujourdhui;

function rendu() {
  const bloque = dejaJoue();
  $("#lancer").disabled = $("#moyeu").disabled = bloque || enCours;
  $("#lancer").textContent = bloque ? "Revenez demain !" : enCours ? "Ça tourne…" : "Lancer la roue";
  $("#lots").innerHTML = lots.length
    ? lots.map((l) => `<div class="lot"><div><b>${esc(l.nom)}</b><small>Valable jusqu'au ${new Date(l.fin).toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}</small></div><code>${esc(l.code)}</code></div>`).join("")
    : `<div class="lot"><small>Rien pour l'instant. Tentez votre chance !</small></div>`;
  store.set("lots", lots);
}

function lancer() {
  if (enCours || dejaJoue()) return;
  // tirage au sort pondéré
  let x = Math.random() * L.reduce((s, l) => s + l.poids, 0), i = 0;
  while ((x -= L[i].poids) > 0) i++;
  const mid = i * part + part / 2, jeu = (Math.random() - 0.5) * part * 0.6;
  rot = Math.ceil(rot / 360) * 360 + 360 * 6 + (360 - mid) + jeu;
  enCours = true; rendu();
  $("#roue").style.transform = `rotate(${rot}deg)`;
  setTimeout(() => { enCours = false; store.set("dernierTour", aujourdhui); resultat(L[i]); }, 5200);
}

function resultat(l) {
  if (l.perdu) $("#gain").innerHTML = `<div class="e">🙈</div><h3>${esc(l.nom)}</h3><p>La roue se recharge chaque matin.</p><button id="ok">D'accord</button>`;
  else {
    const code = C.prefixeCode + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
    lots.unshift({ nom: l.nom, code, fin: Date.now() + C.validiteJours * 864e5 });
    $("#gain").innerHTML = `<div class="e">🎉</div><p>Vous avez gagné</p><h3>${esc(l.nom)}</h3><code>${code}</code><p>Montrez ce code en caisse. Valable ${C.validiteJours} jours.</p><button id="ok">Super !</button>`;
    confettis(); if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  }
  $("#app").classList.add("ouvert"); rendu();
  $("#ok").onclick = () => $("#app").classList.remove("ouvert");
}
function confettis() {
  const couleurs = [C.couleurs.accent, C.couleurs.rose, "#22d3a6", "#fff"];
  for (let i = 0; i < 46; i++) {
    const c = document.createElement("i"); c.className = "confetti";
    c.style.cssText = `left:${Math.random() * 100}%;background:${couleurs[i % 4]};animation-duration:${1.4 + Math.random() * 1.8}s;animation-delay:${Math.random() * 0.5}s`;
    $("#app").appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
$("#lancer").onclick = $("#moyeu").onclick = lancer;
$("#voile").onclick = () => $("#app").classList.remove("ouvert");
rendu();
</script>
</body>
</html>

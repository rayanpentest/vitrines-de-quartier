<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Rendez-vous</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="kit.js"></script>
<style>
:root{--fond:#0e0e0e;--encre:#f2f2ea;--accent:#c8ff2e;--gris:#1c1c1c;--ext:#000}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Space Mono",monospace;background:var(--ext);color:var(--encre);display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{width:100%;max-width:430px;height:100dvh;background:var(--fond);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){.app{height:min(880px,94dvh);border-radius:46px;box-shadow:0 0 0 11px #222,0 40px 90px -20px #000}}
header{padding:30px 20px 14px;display:flex;align-items:center;gap:12px}
#retour{width:42px;height:42px;border:2px solid var(--encre);font-size:1.1rem;flex:none}
#retour[hidden]{display:none}
h1{font-family:Anton,sans-serif;font-weight:400;font-size:1.9rem;text-transform:uppercase;line-height:1;flex:1}
.pas{display:flex;gap:5px;padding:0 20px 16px}
.pas i{flex:1;height:5px;background:var(--gris);transition:.3s}
.pas i.fait{background:var(--accent)}
.scroll{flex:1;overflow-y:auto;padding:0 20px 28px;scrollbar-width:none}
.ecran{animation:arrive .35s both}
@keyframes arrive{from{opacity:0;transform:translateX(26px)}}
h2{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:2.5rem;line-height:.95;margin-bottom:18px}
h2 span{color:var(--accent)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;background:var(--gris);margin-bottom:8px;border-left:5px solid transparent;transition:.15s}
.opt:active,.opt:hover{border-color:var(--accent);transform:translateX(4px)}
.opt span{font-size:1.6rem}
.opt div{flex:1}.opt b{display:block;font-size:1rem}.opt small{opacity:.6}
.opt em{font-family:Anton,sans-serif;font-style:normal;font-size:1.5rem;color:var(--accent)}
.jours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.jours button{padding:14px 4px;background:var(--gris);text-transform:uppercase;font-size:.75rem;border:2px solid transparent}
.jours button b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:2rem;line-height:1.1}
.jours button:hover{border-color:var(--accent)}
.heures{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.heures button{padding:14px 0;background:var(--gris);font-weight:700;border:2px solid transparent}
.heures button:hover{border-color:var(--accent)}
.heures button:disabled{opacity:.25;text-decoration:line-through;cursor:not-allowed}
.vide{opacity:.6;padding:20px 0}
input{width:100%;padding:16px;background:var(--gris);border:2px solid transparent;outline:0;font-size:1.05rem;margin-bottom:12px}
input:focus{border-color:var(--accent)}
.cta{display:block;width:100%;padding:18px;background:var(--accent);color:#000;font-weight:700;text-transform:uppercase;text-align:center;text-decoration:none;margin-top:8px}
.cta.alt{background:none;color:var(--encre);border:2px solid var(--encre)}
.ticket{background:var(--encre);color:#000;padding:22px;margin-bottom:16px;position:relative;-webkit-mask:radial-gradient(circle 9px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 9px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket small{text-transform:uppercase;font-size:.7rem;opacity:.6}
.ticket b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:2rem;text-transform:uppercase;line-height:1.05;margin-bottom:10px}
.ticket hr{border:0;border-top:2px dashed #0005;margin:14px 0}
.mes{margin-top:26px}
.mes h3{font-size:.75rem;text-transform:uppercase;opacity:.6;margin-bottom:8px}
.mes li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #fff2;list-style:none;font-size:.85rem}
.mes button{color:#ff6b5e;font-size:.75rem;text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <header><button id="retour" hidden aria-label="Retour">←</button><h1 data-t="nom"></h1></header>
  <div class="pas" id="pas"></div>
  <div class="scroll" id="ecran"></div>
</div>

<script>
const { $, $$, esc, euro, fh, min, plages, wa, store, JOURS } = K, C = CONFIG;
let etape = 0, choix = {}, rdvs = store.get("rdvs", []);
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const hhmm = (t) => String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
const joli = (isoDate) => new Date(isoDate + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
rdvs = rdvs.filter((r) => r.date >= iso(new Date()));   // on oublie les rendez-vous passés

function joursOuverts() {
  const out = [], d = new Date();
  for (let i = 0; i < 30 && out.length < C.joursAffiches; i++) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
    if (plages(C.horaires[x.getDay()]).length) out.push(x);
  }
  return out;
}
function heures(isoDate) {
  const d = new Date(isoDate + "T12:00"), auj = isoDate === iso(new Date()), n = new Date(), now = n.getHours() * 60 + n.getMinutes(), out = [];
  for (const [a, b] of plages(C.horaires[d.getDay()]))
    for (let t = min(a); t + choix.p.duree <= min(b); t += C.pas)
      if (!auj || t > now + 10) out.push({ h: hhmm(t), pris: rdvs.some((r) => r.date === isoDate && r.heure === hhmm(t)) });
  return out;
}

function rendu() {
  $("#retour").hidden = etape === 0 || etape === 4;
  $("#pas").innerHTML = [0, 1, 2, 3].map((i) => `<i class="${i <= etape ? "fait" : ""}"></i>`).join("");
  const E = $("#ecran");
  if (etape === 0) {
    E.innerHTML = `<div class="ecran"><h2>Quelle <span>prestation</span> ?</h2>${C.prestations.map((p, i) =>
      `<button class="opt" data-i="${i}"><span>${esc(p.emoji)}</span><div><b>${esc(p.nom)}</b><small>${p.duree} min</small></div><em>${euro(p.prix)}</em></button>`).join("")}
      ${rdvs.length ? `<div class="mes"><h3>Mes rendez-vous</h3><ul>${rdvs.map((r, i) => `<li><span>${esc(joli(r.date))} · ${fh(r.heure)}<br>${esc(r.nom)}</span><button data-x="${i}">Annuler</button></li>`).join("")}</ul></div>` : ""}</div>`;
    $$(".opt").forEach((b) => (b.onclick = () => { choix.p = C.prestations[b.dataset.i]; etape = 1; rendu(); }));
    $$(".mes button").forEach((b) => (b.onclick = () => { rdvs.splice(+b.dataset.x, 1); store.set("rdvs", rdvs); rendu(); }));
  } else if (etape === 1) {
    E.innerHTML = `<div class="ecran"><h2>Quel <span>jour</span> ?</h2><div class="jours">${joursOuverts().map((d) =>
      `<button data-d="${iso(d)}">${JOURS[d.getDay()].slice(0, 3)}<b>${d.getDate()}</b>${d.toLocaleDateString("fr-FR", { month: "short" })}</button>`).join("")}</div></div>`;
    $$(".jours button").forEach((b) => (b.onclick = () => { choix.date = b.dataset.d; etape = 2; rendu(); }));
  } else if (etape === 2) {
    const H = heures(choix.date);
    E.innerHTML = `<div class="ecran"><h2>À quelle <span>heure</span> ?</h2><p class="vide" style="padding-top:0">${esc(joli(choix.date))}</p>${H.length
      ? `<div class="heures">${H.map((x) => `<button ${x.pris ? "disabled" : ""}>${fh(x.h)}</button>`).join("")}</div>`
      : `<p class="vide">Plus de créneau ce jour-là. Choisissez un autre jour.</p>`}</div>`;
    $$(".heures button").forEach((b, i) => (b.onclick = () => { choix.heure = H[i].h; etape = 3; rendu(); }));
  } else if (etape === 3) {
    E.innerHTML = `<div class="ecran"><h2>C'est à quel <span>nom</span> ?</h2>
      <input id="prenom" placeholder="Votre prénom" autocomplete="given-name" value="${esc(store.get("prenom", ""))}">
      <button class="cta" id="ok">Valider le rendez-vous</button></div>`;
    $("#ok").onclick = () => {
      const p = $("#prenom").value.trim();
      if (!p) return $("#prenom").focus();
      store.set("prenom", p); choix.prenom = p;
      rdvs.push({ date: choix.date, heure: choix.heure, nom: choix.p.nom }); rdvs.sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure));
      store.set("rdvs", rdvs); etape = 4; rendu();
    };
  } else {
    const msg = `Bonjour ${C.nom}, je souhaite réserver : ${choix.p.nom} (${euro(choix.p.prix)}), ${joli(choix.date)} à ${fh(choix.heure)}, au nom de ${choix.prenom}.`;
    E.innerHTML = `<div class="ecran"><h2>C'est <span>noté</span>.</h2>
      <div class="ticket"><small>Rendez-vous</small><b>${esc(choix.p.nom)}</b><small>Quand</small><b>${esc(joli(choix.date))}<br>${fh(choix.heure)}</b><hr><small>${esc(choix.prenom)} · ${euro(choix.p.prix)} · ${esc(C.adresse)}</small></div>
      <a class="cta" target="_blank" rel="noopener" href="${wa(msg)}">Confirmer par WhatsApp</a>
      <button class="cta alt" id="neuf">Nouveau rendez-vous</button></div>`;
    $("#neuf").onclick = () => { etape = 0; choix = {}; rendu(); };
  }
}
$("#retour").onclick = () => { etape = Math.max(0, etape - 1); rendu(); };
rendu();
</script>
</body>
</html>
